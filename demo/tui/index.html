<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../fixtures.js"></script>
<script src="../shim.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1b1d2b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Triage TUI</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="stylesheet" href="./vendor/fonts/jetbrains-mono.css">
<link rel="preload" href="./vendor/phosphor/Phosphor-Fill.woff2?v=0b9389ed" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./vendor/phosphor/Phosphor.woff2?v=8fc0ad2c" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./vendor/phosphor/regular.css?v=e523c0c5">
<link rel="stylesheet" href="./vendor/phosphor/fill.css?v=d0cccd26">
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./themes/classic.css">
<script type="module" src="./app.js"></script>
</head>
<body>
<div id="splash" class="splash-page"></div>
<div id="app" hidden>
  <div id="tabbar" class="tabbar">
  </div>
  <main id="term" class="term" tabindex="-1">
    <div id="crumb" class="crumb">
      <span id="crumb-info" class="crumb-info"></span>
      <label id="prompt" class="prompt" hidden>
        <span class="prompt-k">/</span>
        <input id="filter" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="filter">
        <span class="prompt-hint">enter apply · esc clear</span>
      </label>
    </div>
    <div id="panel"></div>
  </main>
  <div id="ask" class="ask">
    <div id="askbox" class="askbox" hidden></div>
    <label class="prompt askin">
      <span class="prompt-k">tria &#8250;</span>
      <input id="askq" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="ask tria">
      <span id="askcap" class="askcap" hidden></span>
    </label>
  </div>
  <footer id="keybar" class="keybar">
    <div class="legend" id="legend"></div>
    <input id="kbd" class="kbd-sink" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="keyboard input">
  </footer>
  <div id="modal" class="modal-wrap" hidden></div>
</div>
</body>
</html>
